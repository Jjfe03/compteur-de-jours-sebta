<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>90 Jours - Compteur de territoire</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #3b82f6;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --progress-bg: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
        }

        /* Carte principale */
        .card {
            background-color: var(--card-bg);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        /* Titre */
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }

        .plane-icon {
            font-size: 1.8rem;
        }

        .sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            padding-left: 1rem;
            border-left: 3px solid var(--accent-color);
        }

        /* Zone de sélection date */
        .date-picker {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="date"] {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Grille des compteurs */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background-color: #f8fafc;
            border-radius: 1rem;
            padding: 1.2rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            color: var(--text-primary);
        }

        .stat-unit {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Barre de progression */
        .progress-section {
            margin-bottom: 1.5rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: var(--progress-bg);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--success-color);
            border-radius: 5px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Carte centrale des 90 jours */
        .ninety-card {
            background-color: #f8fafc;
            border-radius: 1rem;
            padding: 1.2rem;
            text-align: center;
            border: 1px solid #e2e8f0;
            margin-bottom: 1.5rem;
        }

        .ninety-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .ninety-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .status-message {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.5rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }

        .status-success {
            color: var(--success-color);
            background-color: rgba(34, 197, 94, 0.1);
        }

        .status-warning {
            color: var(--warning-color);
            background-color: rgba(245, 158, 11, 0.1);
        }

        .status-danger {
            color: var(--danger-color);
            background-color: rgba(239, 68, 68, 0.1);
        }

        hr {
            border: none;
            height: 1px;
            background-color: #e2e8f0;
            margin: 1.5rem 0 1rem;
        }

        .info {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            <span class="plane-icon">✈️</span>
            90 Jours
        </h1>
        <div class="sub">Compteur de sortie de territoire • Règle des 90 jours</div>

        <div class="date-picker">
            <label for="exitDate">📅 Date de départ (sortie)</label>
            <input type="date" id="exitDate">
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Jours hors territoire</div>
                <div class="stat-value" id="daysOut">—</div>
                <div class="stat-unit">jours</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Jours restants</div>
                <div class="stat-value" id="daysLeft">—</div>
                <div class="stat-unit">avant 90j</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>Progression</span>
                <span id="progressText">0 / 90 jours</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <div class="ninety-card">
            <div class="ninety-label">📆 Date limite des 90 jours</div>
            <div class="ninety-value" id="limitDate">—</div>
            <div id="statusMessage" class="status-message">Veuillez sélectionner une date.</div>
        </div>

        <hr>
        <div class="info">
            Mise à jour automatique • Sauvegarde locale • Ne pas dépasser 90 jours
        </div>
    </div>

    <script>
        // Fonction pour normaliser une date à minuit (heure locale)
        function normalizeDate(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        // Calcule la différence en jours entre deux dates normalisées
        function diffInDays(date1, date2) {
            const MS_PER_DAY = 24 * 60 * 60 * 1000;
            const utc1 = Date.UTC(date1.getFullYear(), date1.getMonth(), date1.getDate());
            const utc2 = Date.UTC(date2.getFullYear(), date2.getMonth(), date2.getDate());
            return Math.floor((utc2 - utc1) / MS_PER_DAY);
        }

        function formatDateFR(date) {
            return date.toLocaleDateString('fr-FR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function calculateAndDisplay() {
            const exitDateInput = document.getElementById('exitDate').value;
            const daysOutElem = document.getElementById('daysOut');
            const daysLeftElem = document.getElementById('daysLeft');
            const limitDateElem = document.getElementById('limitDate');
            const statusMsgElem = document.getElementById('statusMessage');
            const progressBarFill = document.getElementById('progressBarFill');
            const progressText = document.getElementById('progressText');

            if (!exitDateInput) {
                daysOutElem.textContent = '—';
                daysLeftElem.textContent = '—';
                limitDateElem.textContent = '—';
                statusMsgElem.textContent = 'Veuillez sélectionner une date de départ.';
                statusMsgElem.className = 'status-message';
                progressBarFill.style.width = '0%';
                progressText.textContent = '0 / 90 jours';
                return;
            }

            const exitDate = normalizeDate(new Date(exitDateInput));
            const today = normalizeDate(new Date());

            // Jours hors territoire (seulement si la date de sortie est passée ou aujourd'hui)
            let daysOut = diffInDays(exitDate, today);
            if (daysOut < 0) daysOut = 0;

            // Date limite = date de sortie + 90 jours
            const limitDate = new Date(exitDate);
            limitDate.setDate(exitDate.getDate() + 90);
            limitDateElem.textContent = formatDateFR(limitDate);

            // Jours restants (positif = encore de la marge, négatif = dépassement)
            const daysLeft = diffInDays(today, limitDate);

            // Mise à jour de l'affichage des jours
            daysOutElem.textContent = daysOut;
            daysLeftElem.textContent = daysLeft >= 0 ? daysLeft : `-${Math.abs(daysLeft)}`;

            // Calcul de la progression (0% à 100%)
            let progressPercent = 0;
            if (daysOut > 0) {
                progressPercent = Math.min((daysOut / 90) * 100, 100);
            }
            progressBarFill.style.width = `${progressPercent}%`;
            progressText.textContent = `${Math.min(daysOut, 90)} / 90 jours`;

            // Détermination du statut et des couleurs
            if (daysLeft > 15) {
                // Dans les temps
                statusMsgElem.textContent = `✅ Dans les temps • Tu peux rester encore ${daysLeft} jour(s)`;
                statusMsgElem.className = 'status-message status-success';
                daysLeftElem.style.color = 'var(--success-color)';
                progressBarFill.style.backgroundColor = 'var(--success-color)';
            } else if (daysLeft > 0 && daysLeft <= 15) {
                // Approche de la limite
                statusMsgElem.textContent = `⚠️ Attention • Plus que ${daysLeft} jour(s) restant(s)`;
                statusMsgElem.className = 'status-message status-warning';
                daysLeftElem.style.color = 'var(--warning-color)';
                progressBarFill.style.backgroundColor = 'var(--warning-color)';
            } else if (daysLeft === 0) {
                // Dernier jour
                statusMsgElem.textContent = '⚠️ Dernier jour • Tu es à la limite des 90 jours';
                statusMsgElem.className = 'status-message status-warning';
                daysLeftElem.style.color = 'var(--warning-color)';
                progressBarFill.style.backgroundColor = 'var(--warning-color)';
            } else {
                // Dépassement
                const overDays = Math.abs(daysLeft);
                statusMsgElem.textContent = `🔴 DÉPASSEMENT • Tu es ${overDays} jour(s) au-delà de la limite`;
                statusMsgElem.className = 'status-message status-danger';
                daysLeftElem.style.color = 'var(--danger-color)';
                progressBarFill.style.backgroundColor = 'var(--danger-color)';
            }
        }

        // Initialisation
        function init() {
            const dateInput = document.getElementById('exitDate');
            const savedDate = localStorage.getItem('exitDate90');

            if (savedDate) {
                dateInput.value = savedDate;
            } else {
                // Date par défaut : aujourd'hui
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}`;
            }

            calculateAndDisplay();

            // Sauvegarde et recalcul à chaque changement
            dateInput.addEventListener('change', function() {
                localStorage.setItem('exitDate90', this.value);
                calculateAndDisplay();
            });

            // Mise à jour automatique à minuit pour être précis
            const now = new Date();
            const msUntilMidnight = (24 - now.getHours()) * 3600000 - now.getMinutes() * 60000 - now.getSeconds() * 1000;
            setTimeout(() => {
                calculateAndDisplay();
                setInterval(calculateAndDisplay, 86400000); // Puis une fois par jour
            }, msUntilMidnight);
        }

        init();
    </script>
</body>
</html>
